upstream api {
    server api:8000;
}

upstream dashboard {
    server dashboard:3001;
}

upstream station {
    server station:3002;
}

server {
    listen 80;
    server_name _;

    # SSE requires these to disable buffering
    proxy_buffering off;
    proxy_cache off;

    # ── Backend API ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE: keep connection alive
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Prometheus metrics (internal only) ──────────────────────────────────
    location /metrics {
        proxy_pass http://api;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # ── Station App (worker-facing PWA) ─────────────────────────────────────
    location /station/ {
        proxy_pass http://station/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Manager Dashboard (default root) ────────────────────────────────────
    location / {
        proxy_pass http://dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
